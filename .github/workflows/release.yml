name: Publish Her World
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, for example 0.1.0'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: her-world-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/project-runtime
      - name: Select and validate version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import semver from 'semver';
          import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync('package.json'));
          const version=process.env.REQUESTED_VERSION;
          assert.equal(semver.valid(version),version,'Use exact SemVer without a v prefix');
          p.version=version;writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          appendFileSync(process.env.GITHUB_ENV,`RELEASE_VERSION=${version}\n`);
          JS
          export RELEASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION"; then
            git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
            git restore --worktree package.json
            git checkout --detach "v$RELEASE_VERSION"
            node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const frozen=JSON.parse(readFileSync("release.json")); assert.equal(frozen.sourceCommit,process.env.GITHUB_SHA,"Version belongs to a different source commit; choose a new version");'
            echo 'REUSE_TAG=1' >> "$GITHUB_ENV"
          else
            node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("release.json",JSON.stringify({version:process.env.RELEASE_VERSION,sourceCommit:process.env.GITHUB_SHA},null,2)+"\n");'
          fi
      - name: Verify and freeze installable Git commit
        id: frozen
        shell: bash
        run: |
          pnpm run verify
          if [ "${REUSE_TAG:-0}" != 1 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add --update
            git add release.json
            git add -f dist/src
            git reset -- 'dist/src/**/*.js.map'
            git commit -m "Release Her World $RELEASE_VERSION"
            git tag "v$RELEASE_VERSION"
            git push origin "refs/tags/v$RELEASE_VERSION"
          else
            git diff --exit-code -- src vendor dist/src package.json release.json
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish checked archive to npm through trusted publishing
        shell: bash
        run: |
          archive=".cache/release/her-world-$RELEASE_VERSION.tgz"
          expected="$(node -e 'const fs=require("fs"),c=require("crypto");console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$archive")"
          read_integrity() {
            npm view "her-world@$RELEASE_VERSION" dist.integrity --json --prefer-online --registry=https://registry.npmjs.org/ > .cache/release/npm-version.json 2> .cache/release/npm-view.log
          }
          matches_archive() {
            node -e 'require("assert/strict").equal(JSON.parse(require("fs").readFileSync(".cache/release/npm-version.json")),process.argv[1])' "$expected"
          }
          if read_integrity; then
            matches_archive
          else
            node -e 'require("assert/strict").equal(JSON.parse(require("fs").readFileSync(".cache/release/npm-version.json")).error.code,"E404")'
            tag=latest
            if [[ "$RELEASE_VERSION" == *-* ]]; then tag=next; fi
            npm publish "$archive" --ignore-scripts --access=public --registry=https://registry.npmjs.org/ --tag="$tag"
          fi
          # Metadata can appear before the ordinary install URL stops returning
          # a cached 404. Do not finish publication until its bytes match.
          pnpm run check:published -- "$archive"
      - name: Promote verified runtime to the default GitHub install branch
        env:
          RELEASE_COMMIT: ${{ steps.frozen.outputs.commit }}
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            git push origin "$RELEASE_COMMIT:refs/heads/main"
          fi
      - name: Publish release and checked archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" .cache/release/*.tgz .cache/release/SHA256SUMS --clobber
          else
            gh release create "v$RELEASE_VERSION" .cache/release/*.tgz .cache/release/SHA256SUMS --verify-tag --title "Her World $RELEASE_VERSION" --notes-file docs/release/notes.md "${prerelease[@]}"
          fi

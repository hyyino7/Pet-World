name: Publish Her World
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, for example 0.1.0-rc.2 (stable remains blocked while the known P2 is open)'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: her-world-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/project-runtime
      - name: Select and validate version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          source ./scripts/env.sh
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import semver from 'semver';
          import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync('package.json'));
          const version=process.env.EVENT_NAME==='workflow_dispatch'?process.env.REQUESTED_VERSION:process.env.GITHUB_REF_NAME.slice(1);
          assert.equal(semver.valid(version),version,'Use exact SemVer without a v prefix');
          if(process.env.EVENT_NAME!=='workflow_dispatch')assert.equal(p.version,version,'Tag and package version differ');
          p.version=version;writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          appendFileSync(process.env.GITHUB_ENV,`RELEASE_VERSION=${version}\n`);
          JS
          RELEASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION"; then
              git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
              git checkout --detach "v$RELEASE_VERSION"
              node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const frozen=JSON.parse(readFileSync("release.json")); assert.equal(frozen.sourceCommit,process.env.GITHUB_SHA,"Version belongs to a different source commit; choose a new version");'
              echo 'REUSE_TAG=1' >> "$GITHUB_ENV"
            fi
          fi
      - name: Verify and freeze installable Git commit
        id: frozen
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          source ./scripts/env.sh
          pnpm run check:env
          pnpm run check:types
          pnpm test
          pnpm run check:release
          pnpm run test:refresh
          pnpm run test:release
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "${REUSE_TAG:-0}" != 1 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            export SOURCE_SHA="$GITHUB_SHA"
            node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("release.json",JSON.stringify({version:process.env.RELEASE_VERSION,sourceCommit:process.env.SOURCE_SHA},null,2)+"\n");'
            git add --update
            git add release.json
            git add -f dist/src
            git reset -- 'dist/src/**/*.js.map'
            git commit -m "Release Her World $RELEASE_VERSION"
            git tag "v$RELEASE_VERSION"
            git push origin "HEAD:refs/heads/releases/v$RELEASE_VERSION" "refs/tags/v$RELEASE_VERSION"
          else
            git diff --exit-code -- src vendor dist/src
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .cache/release
          COPYFILE_DISABLE=1 pnpm pack --pack-destination .cache/release
          pnpm run check:package .cache/release/her-world-*.tgz
          cd .cache/release
          shasum -a 256 her-world-*.tgz > SHA256SUMS
      - name: Publish checked archive to npm through trusted publishing
        shell: bash
        run: |
          source ./scripts/env.sh
          node scripts/publish-npm.mjs .cache/release/her-world-$RELEASE_VERSION.tgz
      - name: Promote verified runtime to the default GitHub install branch
        env:
          RELEASE_COMMIT: ${{ steps.frozen.outputs.commit }}
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            git push origin "$RELEASE_COMMIT:refs/heads/main"
          fi
      - name: Publish release and checked archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" .cache/release/*.tgz .cache/release/SHA256SUMS --clobber
          else
            gh release create "v$RELEASE_VERSION" .cache/release/*.tgz .cache/release/SHA256SUMS --verify-tag --title "Her World $RELEASE_VERSION" --notes-file docs/release/notes.md "${prerelease[@]}"
          fi
